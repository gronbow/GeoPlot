name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run scientific, safety, and desktop source tests
        run: python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

  rust:
    name: Rust
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            apps/desktop/backend/requirements-build.txt

      - name: Install sidecar build dependencies
        run: python -m pip install -r requirements-dev.txt -r apps/desktop/backend/requirements-build.txt

      - name: Build reviewed Windows sidecar
        shell: pwsh
        run: |
          python scripts/build_sidecar.py --target x86_64-pc-windows-msvc
          "GEOSKILLS_DESKTOP_SOURCE_PYTHON=$((Get-Command python).Source)" >> $env:GITHUB_ENV

      - name: Run source and frozen bridge parity
        env:
          GEOSKILLS_FROZEN_BRIDGE: apps/desktop/src-tauri/binaries/geoskills-desktop-bridge-x86_64-pc-windows-msvc.exe
        run: python -m pytest apps/desktop/backend/tests/test_frozen_parity.py -q

      - name: Select minimum supported Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          rustup default 1.85.0

      - name: Run Rust tests
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

  dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: skills/geoskills/scripts/requirements.txt

      - name: Install audit tool outside runtime requirements
        run: python -m pip install pip-audit

      - name: Audit resolved scientific dependencies
        run: python -m pip_audit --strict --requirement skills/geoskills/scripts/requirements.txt

  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check product versions
        run: python scripts/check_versions.py
